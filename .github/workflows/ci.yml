name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Model Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Syntax Check
        run: |
          python -m compileall -q src/ tests/

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --durations=10

      - name: Verify Model Manifest & Governance
        run: |
          python -c "
          import json
          with open('models/model_manifest.json') as f:
              m = json.load(f)
          assert len(m['models']) == 5, f'Expected 5 serialized models in manifest, got {len(m[\"models\"])}'
          assert m['governance_status'] in ['CERTIFIED_HEALTHY', 'PASS'], f'Unexpected governance status: {m[\"governance_status\"]}'
          for name, spec in m['models'].items():
              assert 'type' in spec and 'status' in spec, f'Model {name} missing type/status'
          print(f'CI Model Governance Check: PASSED ({len(m[\"models\"])} certified engines)')
          "

  docker:
    name: Build & Verify Docker Containers
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: nexus-retail-api:ci-test

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexus-retail-web:ci-test

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo 'Docker Compose Configuration: VALID'


