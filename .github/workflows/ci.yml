name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Model Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Syntax Check
        run: |
          python -m py_compile src/data/*.py src/features/*.py src/models/*.py src/utils/*.py app/*.py

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --durations=10

      - name: Verify Model Manifest
        run: |
          python -c "
          import json
          with open('models/model_manifest.json') as f:
              m = json.load(f)
          assert len(m['models']) == 5, f'Expected 5 serialized models in manifest, got {len(m[\"models\"])}'
          print('CI Manifest Check: PASSED')
          "

