# ==============================================================================
# Render Infrastructure Blueprint Configuration (render.yaml)
# Nexus Retail AI - Enterprise Customer Intelligence Platform
# Pure HTML5, CSS3 & JavaScript Web Application
# ==============================================================================

services:
  # High-Performance Static Web Application (HTML / CSS / Vanilla JS)
  - type: static
    name: nexus-retail-ai
    env: static
    region: oregon
    plan: free
    buildCommand: "echo 'Static assets ready for deployment'"
    staticPublishPath: "."
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /style.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /app.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
