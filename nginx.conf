server {
    listen 80;
    server_name localhost;

    # Dynamic DNS resolver for Docker internal network and cloud runtimes (prevents startup crash if upstream host is pending)
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    # Upstream backend address (runtime-resolved variable so Nginx boots even in standalone mode)
    set $backend_api "http://api:8000";

    # Serve static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Lightweight health check endpoint for Render, Docker, and container orchestrators
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"prism-retail-web"}';
    }

    # Proxy ML inference API requests to FastAPI backend
    location /api/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket live streams (POS Simulator & Real-time MLOps updates)
    location /ws/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy OpenAPI documentation
    location /docs {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
    }
}

